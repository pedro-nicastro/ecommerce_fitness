    <!-- JS -->
    <script>
        function placeOrder() {

            function areInputsFilled(inputs) {
                for (var i = 0; i < inputs.length; i++) {
                    if (inputs[i].value.trim() === "") {
                        return false;
                    }
                }
                return true;
            }
            console.log("Checkout function called");

            // Check if the required inputs are filled
            var addressInputs = document.querySelectorAll('.checkout-fields:first-child input');
            var cardInputs = document.querySelectorAll('.checkout-fields:last-child input');
            if (areInputsFilled(addressInputs) && areInputsFilled(cardInputs)) {
                var loadingOverlay = document.getElementById('loadingOverlay');
                loadingOverlay.style.visibility = 'visible';
                setTimeout(function () {
                    loadingOverlay.style.visibility = 'hidden'; window.location.href = "index.html";
                }, 1500);
            } else {
                alert("Please complete all required fields.");
            }
        }

        function maskJs(value, pattern) {
            let i = 0;
            let v = value.toString();
            v = v.replace(/\D/g, '');
            return pattern.replace(/#/g, () => v[i++] || '');
        };

        function applyCardMask(value) {
            const formatted = maskJs(value, '####-####-####-####');
            document.getElementById('card-number').value = formatted;
        }
        var expiryInput = document.querySelector('.js-date');

        var dateInputMask = function dateInputMask(elm) {
            elm.addEventListener('keypress', function (e) {
                if (e.keyCode < 47 || e.keyCode > 57) {
                    e.preventDefault();
                }

                var len = elm.value.length;

                // If we're at a particular place, let the user type the slash
                // i.e., 12/12/1212
                if (len !== 1 || len !== 3) {
                    if (e.keyCode == 47) {
                        e.preventDefault();
                    }
                }

                // If they don't add the slash, do it for them...
                if (len === 2) {
                    elm.value += '/';
                }

                // If they don't add the slash, do it for them...
                if (len === 5) {
                    elm.value += '/';
                }
            });
        };

        if (expiryInput) dateInputMask(expiryInput);
    </script>
